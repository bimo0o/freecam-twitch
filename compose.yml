services:
  media:
    image: bluenviron/mediamtx:1.21.3
    restart: unless-stopped
    volumes:
      - ./infra/mediamtx.local.yml:/mediamtx.yml:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '127.0.0.1:1935:1935'
      - '127.0.0.1:8888:8888'
      - '127.0.0.1:8889:8889'
      - '8189:8189/udp'
