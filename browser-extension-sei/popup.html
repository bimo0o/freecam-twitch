<!doctype html><html lang="ru"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{width:360px;margin:0;padding:20px;background:radial-gradient(ellipse at 100% 0,#3a214c,transparent 70%),#100c17;color:#f5f0ff;font:14px/1.5 system-ui}header{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:750}header img{width:32px;height:32px}p{color:#beafcc}#state{margin:16px 0 10px;padding:14px;border:1px solid #63447a;border-radius:12px;background:#20162b;display:flex;align-items:center;gap:10px}#dot{width:9px;height:9px;flex-shrink:0;border-radius:50%;background:#8a7798}body[data-state=active] #dot{background:#c79aff;box-shadow:0 0 14px #b17be488}body[data-state=error] #dot{background:#efb780}body[data-state=paused] #dot{background:#a99bb5}body[data-state=waiting] #dot{animation:pulse 1.5s ease-in-out infinite}button{font:600 14px system-ui;padding:11px 14px;border:1px solid #8c64a8;border-radius:9px;cursor:pointer;transition:background 140ms,box-shadow 140ms;background:#c79aff;color:#170e22}button:hover{background:#dfbfff;box-shadow:0 3px 14px #c79aff25}button:focus-visible{outline:2px solid #fff;outline-offset:3px}#off{background:transparent;color:#dac6e9}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:10px;margin:16px 0}details{font-size:12px;color:#b6a1c5;border-top:1px solid #50345f;padding-top:14px}summary{cursor:pointer}textarea{width:100%;margin:12px 0;resize:vertical;min-height:150px;padding:10px;background:#160f20;border:1px solid #63447a;border-radius:8px;color:#dac6e9;font:11px/1.6 system-ui}#version{margin-left:auto;font-size:11px;font-weight:500}#copy-result{display:block;margin-top:8px}small{color:#aa92ba}@keyframes pulse{50%{opacity:.3}}.tagline{color:#f5f0ff}.tagline span{color:#c79aff}#message{font-weight:600}#hint{min-height:42px;font-size:13px}#state{min-height:64px}button:disabled:hover{transform:none;box-shadow:none}body[data-state=error] #state{border-color:#805b43}.preference{padding:12px;border:1px solid #50345f;border-radius:12px;background:#c79aff08;animation:reveal 220ms ease both}.preference label{font-size:13px;line-height:1.6;display:block}.preference output{color:#d6b0ff;font-weight:750;white-space:nowrap}.preference input{width:100%;margin:16px 0 3px;accent-color:#c79aff;cursor:pointer}.preference input:focus-visible{outline:2px solid #c79aff;outline-offset:4px;border-radius:8px}.range-labels{display:flex;justify-content:space-between;font-size:10px;color:#aa92ba}.preference p{font-size:11px;margin:10px 0 0}.preference small{font-size:11px;display:block;min-height:17px;margin-top:6px}#appearance{margin-top:12px}#appearance label{display:block;margin:12px 0;color:#ded0ec}#appearance input{display:block;width:100%;accent-color:#c79aff}#appearance output{float:right;color:#c79aff}#appearance-status{display:block;margin-top:8px}html{background:#100c17}body{min-height:400px;background-repeat:no-repeat}header,body>p,#state,.actions,details,body>small{animation:reveal 220ms cubic-bezier(.2,.7,.2,1) both}body>p{animation-delay:25ms}#state{animation-delay:45ms;transition:border-color 180ms ease,background-color 180ms ease}#hint{animation-delay:60ms}.actions{animation-delay:75ms}details,body>small{animation-delay:90ms}body[data-state=active] #state{border-color:#9363b7;background-color:#291a36}#dot{transition:background-color 180ms,box-shadow 180ms}button:not(:disabled){transition:background 140ms,box-shadow 140ms,transform 100ms}button:not(:disabled):hover{transform:translateY(-1px)}button:not(:disabled):active{transform:translateY(0) scale(.97)}details[open] textarea{animation:reveal 160ms ease both}@keyframes reveal{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
<title>Freecam</title><header><img src="icons/32.png" alt="">freecam<small id="version"></small></header><p class="tagline">Твоя камера. <span>Твоё место.</span></p><div id="state" role="status" aria-live="polite"><span id="dot"></span><span id="message">Проверка канала…</span></div><p id="hint">На совместимом эфире выберите Source и перетащите вебку.</p><section class="preference"><label for="restore-percent">Восстанавливать фон, если вебка занимает до <output id="percent-value" for="restore-percent">25%</output> экрана</label><input id="restore-percent" type="range" min="1" max="100" step="1" value="25" disabled aria-describedby="percent-hint"><div class="range-labels"><span>1%</span><span>100%</span></div><p id="percent-hint">Больше выбранного размера — обычный эфир. Настройка меняет только ваш вид.</p><small id="preference-status" role="status" aria-live="polite"></small></section><details id="appearance"><summary>Вид камеры</summary><label>Размер <output id="camera-width-value">28%</output><input id="camera-width" type="range" min="10" max="70" value="28"></label><label>Скругление <output id="camera-radius-value">0 px</output><input id="camera-radius" type="range" min="0" max="48" value="0"></label><button id="camera-reset">Вернуть в угол</button><small id="appearance-status" role="status"></small></details><div class="actions"><button id="on" disabled>Включить</button><button id="off" disabled>Отключить</button></div><details><summary>Диагностика</summary><textarea id="status" readonly rows="10" aria-label="Отчёт диагностики Freecam" spellcheck="false"></textarea><button id="copy-status">Скопировать отчёт</button><small id="copy-result" role="status" aria-live="polite"></small></details><small>Данные находятся внутри видео.</small><script src="popup.js"></script></html>
