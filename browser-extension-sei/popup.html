<!doctype html><html lang="ru"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{width:360px;margin:0;padding:22px;background:radial-gradient(ellipse at 100% 0,#3a214c,transparent 70%),#100c17;color:#f5f0ff;font:14px/1.5 system-ui}header{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:750}header img{width:32px;height:32px}p{color:#beafcc}#state{margin:20px 0 10px;padding:14px;border:1px solid #63447a;border-radius:12px;background:#20162b;display:flex;align-items:center;gap:10px}#dot{width:9px;height:9px;flex-shrink:0;border-radius:50%;background:#8a7798}body[data-state=active] #dot{background:#c79aff;box-shadow:0 0 14px #b17be488}body[data-state=error] #dot{background:#efb780}body[data-state=paused] #dot{background:#a99bb5}body[data-state=waiting] #dot{animation:pulse 1.5s ease-in-out infinite}button{font:600 14px system-ui;padding:11px 14px;border:1px solid #8c64a8;border-radius:9px;cursor:pointer;transition:background 140ms,box-shadow 140ms;background:#c79aff;color:#170e22}button:hover{background:#dfbfff;box-shadow:0 3px 14px #c79aff25}button:focus-visible{outline:2px solid #fff;outline-offset:3px}#off{background:transparent;color:#dac6e9}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:10px;margin:18px 0}details{font-size:12px;color:#b6a1c5;border-top:1px solid #50345f;padding-top:14px}summary{cursor:pointer}pre{white-space:pre-wrap;font:12px/1.65 system-ui}small{color:#aa92ba}@keyframes pulse{50%{opacity:.3}}.tagline{color:#f5f0ff}.tagline span{color:#c79aff}#message{font-weight:600}#hint{min-height:66px}#state{min-height:64px}button:disabled:hover{transform:none;box-shadow:none}body[data-state=error] #state{border-color:#805b43}html{background:#100c17}body{min-height:400px;background-repeat:no-repeat}header,body>p,#state,.actions,details,body>small{animation:reveal 220ms cubic-bezier(.2,.7,.2,1) both}body>p{animation-delay:25ms}#state{animation-delay:45ms;transition:border-color 180ms ease,background-color 180ms ease}#hint{animation-delay:60ms}.actions{animation-delay:75ms}details,body>small{animation-delay:90ms}body[data-state=active] #state{border-color:#9363b7;background-color:#291a36}#dot{transition:background-color 180ms,box-shadow 180ms}button:not(:disabled){transition:background 140ms,box-shadow 140ms,transform 100ms}button:not(:disabled):hover{transform:translateY(-1px)}button:not(:disabled):active{transform:translateY(0) scale(.97)}details[open] pre{animation:reveal 160ms ease both}@keyframes reveal{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style>
